<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI面接練習</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
  <div class="topstripe"></div>
  <div class="headrow">
    <div class="brand">
      <div class="ham">☰</div>
      <h1 onclick="showScreen('home')">AI面接練習</h1>
    </div>
    <div class="user">
      <span>👤 山邨 優輝 様</span>
      <button class="pillbtn" onclick="showScreen('history')">練習履歴</button>
      <button class="pillbtn" onclick="showScreen('home')">HOME</button>
    </div>
  </div>
</header>
<div class="crumb" id="crumb">HOME &gt; 面接練習</div>

<main>

  <!-- HOME: favorite companies -->
  <section id="screen-home" class="panel">
    <div class="stitle"><span class="ico"></span>お気に入り企業一覧</div>
    <div id="companyList"></div>
    <p class="empty" id="homeEmpty" style="display:none;">お気に入り登録した企業がまだありません。企業提案機能から気になる企業をお気に入りに追加してください。</p>
  </section>

  <!-- MODE SELECT -->
  <section id="screen-mode" class="panel hidden">
    <div class="stitle"><span class="ico"></span><span id="modeCompanyName"></span>の面接練習</div>
    <fieldset>
      <legend>練習方法を選択</legend>
      <label style="display:block;margin-bottom:8px;"><input type="radio" name="mode" value="all" checked onchange="onModeChange()"> 全体練習（過去の質問をすべて練習する）</label>
      <label style="display:block;"><input type="radio" name="mode" value="pick" onchange="onModeChange()"> 質問を選んで練習する</label>
    </fieldset>
    <fieldset id="questionPickBox" class="hidden">
      <legend>過去に出題された質問</legend>
      <div id="qList"></div>
    </fieldset>
    <div class="row">
      <button class="btn ghost" onclick="showScreen('home')">戻る</button>
      <button class="btn" onclick="goToCameraCheck()">次へ（カメラ確認）</button>
    </div>
  </section>

  <!-- CAMERA CHECK -->
  <section id="screen-camera" class="panel hidden">
    <div class="stitle"><span class="ico"></span>カメラ・マイクの確認</div>
    <video id="preview" autoplay muted playsinline></video>
    <div class="status">
      <span><span class="dot" id="camDot"></span>カメラ</span>
      <span><span class="dot" id="micDot"></span>マイク</span>
    </div>
    <p style="font-size:13px;color:#666;">カメラとマイクが正しく認識されていることを確認してから、面接を開始してください。</p>
    <div class="row">
      <button class="btn ghost" onclick="showScreen('mode')">戻る</button>
      <button class="btn" id="startBtn" disabled onclick="startInterview()">面接スタート</button>
    </div>
  </section>

  <!-- HISTORY -->
  <section id="screen-history" class="panel hidden">
    <div class="stitle"><span class="ico"></span>練習履歴</div>
    <div id="logList"></div>
    <p class="empty hidden" id="historyEmpty">まだ練習記録はありません。</p>
  </section>

  <!-- PLAYBACK -->
  <section id="screen-playback" class="panel hidden">
    <div class="stitle"><span class="ico"></span>練習ログ確認</div>
    <div id="pbMeta" style="font-size:13px;color:#666;margin-bottom:10px;"></div>
    <video id="pbVideo" controls style="width:100%;border-radius:6px;background:#000;"></video>
    <div class="row" style="margin-top:16px;">
      <button class="btn ghost" onclick="showScreen('history')">履歴に戻る</button>
    </div>
  </section>

</main>

<!-- FULLSCREEN INTERVIEW -->
<div id="interview">
  <video id="ivideo" autoplay muted playsinline></video>
  <div class="topbar">
    <span id="ivCompany"></span>
    <button onclick="endInterview(true)">中断して終了</button>
  </div>
  <div class="cap">
    <div class="meta" id="ivProgress"></div>
    <div class="qtext" id="ivQtext">まもなく開始します…</div>
    <div class="answerBox hidden" id="answerBox">
      <span class="rec hidden" id="recIndicator"><span class="b"></span>回答を聞いています…</span>
      <p class="liveCaption" id="liveCaption"></p>
      <button class="btn ghost hidden" id="manualSendBtn" style="margin-top:8px;">回答が終わったら押す</button>
    </div>
    <div class="fallbackBox hidden" id="fallbackBox">
      <textarea id="fallbackText" rows="2" placeholder="この端末では音声認識が使えないため、回答をここに入力してください"></textarea>
      <button class="btn" onclick="submitFallbackAnswer()">回答を送信</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
